<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>알록달록 한글 단어 놀이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@800&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    
    <script src="words.js?v=1.2"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 8px;
            background-color: #fef8ee;
            font-family: 'Gaegu', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            touch-action: none;
            overflow: hidden;
        }

        /* 1. 카테고리 선택 바 */
        .category-scroll-container {
            width: 100%;
            max-width: 580px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 6px;
            padding: 2px 4px 6px 4px;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .category-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            background-color: #ffffff;
            border: 2px solid #ffd166;
            border-bottom: 3px solid #e0ab34;
            color: #634200;
            font-family: 'Gaegu', cursive;
            font-size: 16px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .category-btn.active {
            background-color: #ff7675;
            color: #ffffff;
            border-color: #d63031;
            border-bottom: 3px solid #c0392b;
            transform: scale(1.04);
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 580px;
        }

        /* 2. 상단 상태창 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(92vw, 560px);
            margin-bottom: 6px;
            flex-shrink: 0;
            position: relative;
        }

        .stamp-board {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            border: 2px solid #ffd166;
            box-shadow: 0 3px 6px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
        }

        .stamp-board.celebrate {
            transform: scale(1.1);
            background-color: #fff9db;
            border-color: #f59f00;
        }

        .stamp-title {
            font-size: 15px;
            font-weight: bold;
            color: #d97706;
        }

        .stamp-star {
            font-size: 17px;
            color: #e5e7eb;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.25s;
        }

        .stamp-star.earned {
            color: #fbbf24;
            transform: scale(1.2);
            filter: drop-shadow(0 2px 4px rgba(251, 191, 36, 0.5));
        }

        .crown-badge {
            font-size: 16px;
            font-weight: bold;
            color: #d97706;
            margin-left: 4px;
        }

        .page-badge {
            background: #ffffff;
            border: 2px solid #dcdde1;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #57606f;
        }

        /* 3. 팔레트 & 스피커 바 */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .palette-container {
            display: flex;
            gap: 6px;
            background: #ffffff;
            padding: 4px 8px;
            border-radius: 40px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            border: 2px solid #f0e6d6;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
            transition: transform 0.15s ease;
        }

        .color-dot.active {
            transform: scale(1.18);
            border-color: #4a3427;
        }

        .btn-speaker {
            background: #fff;
            border: 2px solid #ffd166;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        /* 4. 칠판 프레임 */
        .board-frame {
            position: relative;
            padding: 6px;
            border-radius: 22px;
            background: linear-gradient(135deg, #ff7675, #fab1a0, #ffeaa7, #55efc4, #81ecec, #74b9ff, #a29bfe);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            flex-shrink: 0;
        }

        #game-board {
            width: min(92vw, 560px);
            height: min(48vw, 260px);
            background-color: #ffffff;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .char-box {
            flex: 1;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1.5px dashed #e2e8f0;
        }

        .char-box:last-child {
            border-right: none;
        }

        .char-box::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1.5px dashed #e2e8f0;
            pointer-events: none;
        }

        .char-box::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            border-left: 1.5px dashed #e2e8f0;
            pointer-events: none;
        }

        .guide-char {
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            color: #dcdde1;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            letter-spacing: -2px;
        }

        #draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            touch-action: none;
        }

        /* 5. 하단 버튼 */
        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        button.action-btn {
            border: 2px solid #333;
            border-bottom: 4px solid #222;
            padding: 6px 16px;
            font-family: 'Gaegu', cursive;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.1s;
        }

        button.action-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-prev { background-color: #68d8d6; color: #1a4a49; }
        .btn-clear { background-color: #ffd166; color: #5c4200; }
        .btn-done { background-color: #ff9ff3; color: #57004f; }
        .btn-next { background-color: #06d6a0; color: #034b38; }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* 가로 모드 (Landscape) */
        @media (orientation: landscape) and (max-height: 520px) {
            body {
                padding: 4px 12px;
                justify-content: space-evenly;
            }

            .category-scroll-container {
                max-width: 95vw;
                padding-bottom: 2px;
            }

            .category-btn {
                font-size: 14px;
                padding: 3px 10px;
                border-radius: 14px;
            }

            .main-layout {
                flex-direction: row;
                align-items: center;
                justify-content: center;
                max-width: 96vw;
                gap: 14px;
            }

            .controls-column {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            .status-bar {
                width: 100%;
                margin-bottom: 0;
                gap: 8px;
            }

            .top-bar {
                margin-bottom: 0;
            }

            #game-board {
                width: min(58vw, 480px);
                height: min(65vh, 260px);
            }

            .btn-group {
                margin-top: 2px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                width: 100%;
            }

            button.action-btn {
                padding: 6px 10px;
                font-size: 16px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="category-scroll-container" id="category-bar"></div>

    <div class="main-layout">
        <div class="board-frame">
            <div id="game-board">
                <canvas id="draw-canvas"></canvas>
            </div>
        </div>

        <div class="controls-column">
            <div class="status-bar">
                <div class="stamp-board" id="stamp-board-box">
                    <span class="stamp-title">⭐ 도장</span>
                    <span class="stamp-star" id="star-0">★</span>
                    <span class="stamp-star" id="star-1">★</span>
                    <span class="stamp-star" id="star-2">★</span>
                    <span class="stamp-star" id="star-3">★</span>
                    <span class="stamp-star" id="star-4">★</span>
                    <span class="crown-badge" id="crown-badge"></span>
                </div>
                <div class="page-badge" id="page-badge">1 / 1</div>
            </div>

            <div class="top-bar">
                <div class="palette-container" id="palette">
                    <div class="color-dot" style="background-color: #ff4757;" data-color="#ff4757"></div>
                    <div class="color-dot" style="background-color: #ffa502;" data-color="#ffa502"></div>
                    <div class="color-dot" style="background-color: #2ed573;" data-color="#2ed573"></div>
                    <div class="color-dot active" style="background-color: #1e90ff;" data-color="#1e90ff"></div>
                    <div class="color-dot" style="background-color: #9b59b6;" data-color="#9b59b6"></div>
                    <div class="color-dot" style="background-color: #2f3542;" data-color="#2f3542"></div>
                </div>
                <div class="btn-speaker" onclick="speakCurrentWord()" title="소리 듣기">🔊</div>
            </div>

            <div class="btn-group">
                <button class="action-btn btn-prev" onclick="prevWord()">◀ 이전</button>
                <button class="action-btn btn-clear" onclick="clearCanvas()">🧼 지우기</button>
                <button class="action-btn btn-done" onclick="finishLetter()">✨ 완성!</button>
                <button class="action-btn btn-next" onclick="nextWord()">다음 ▶</button>
            </div>
        </div>
    </div>

    <canvas id="fx-canvas"></canvas>

    <script>
        const defaultCategories = {
            "가나다": ["가", "나", "다", "라", "마", "바", "사"],
            "예쁜 이름": ["연아", "시우", "지우"],
            "우리 가족": ["엄마", "아빠", "사랑해"]
        };

        const categories = (typeof wordCategories !== 'undefined') ? wordCategories : defaultCategories;
        const categoryKeys = Object.keys(categories);

        let currentCategoryKey = categoryKeys[0];
        let currentWords = categories[currentCategoryKey] || ["가"];
        let currentIndex = 0;
        let isDrawing = false;
        let currentColor = '#1e90ff'; // 기본 펜 색상 파란색 설정
        let baseLineWidth = 7;
        let starCount = 0;
        let crownCount = 0;

        const board = document.getElementById('game-board');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const palette = document.getElementById('palette');
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        const categoryBar = document.getElementById('category-bar');
        const pageBadge = document.getElementById('page-badge');
        const stampBoardBox = document.getElementById('stamp-board-box');
        const crownBadge = document.getElementById('crown-badge');

        function initCategoryBar() {
            categoryBar.innerHTML = '';
            categoryKeys.forEach(catName => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${catName === currentCategoryKey ? 'active' : ''}`;
                btn.textContent = catName;
                btn.onclick = () => selectCategory(catName);
                categoryBar.appendChild(btn);
            });
        }

        function selectCategory(catName) {
            currentCategoryKey = catName;
            currentWords = categories[catName] || ["가"];
            currentIndex = 0;

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === catName);
            });

            renderWord(currentWords[currentIndex]);
        }

        /* 🔊 볼륨 증폭 Web Audio 사운드 시스템 */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const chimeNotes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        let noteIndex = 0;
        let lastToneTime = 0;

        function playChimeNote() {
            const now = Date.now();
            if (now - lastToneTime < 85) return;
            lastToneTime = now;

            if (audioCtx.state === 'suspended') audioCtx.resume();

            const freq = chimeNotes[noteIndex % chimeNotes.length];
            noteIndex++;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        function playTone(freq, type, duration, startDelay = 0, volume = 0.35) {
            setTimeout(() => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, startDelay);
        }

        function soundSuccess() {
            playTone(523.25, 'triangle', 0.15, 0, 0.35);
            playTone(659.25, 'triangle', 0.15, 100, 0.35);
            playTone(783.99, 'triangle', 0.15, 200, 0.35);
            playTone(1046.50, 'triangle', 0.35, 300, 0.45);
        }

        function soundClear() {
            playTone(320, 'sine', 0.12, 0, 0.32);
            playTone(220, 'sine', 0.15, 80, 0.32);
        }

        /* 🔊 TTS 발음 읽기 */
        function speakCurrentWord() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const text = currentWords[currentIndex];
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ko-KR';
            utter.rate = 0.85;
            utter.pitch = 1.25;
            utter.volume = 1.0;
            window.speechSynthesis.speak(utter);
        }

        /* 폭죽 효과 */
        let confettiParticles = [];
        function fireConfetti() {
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#ffd32a'];
            for (let i = 0; i < 40; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.8) * 16,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    alpha: 1
                });
            }
        }

        function updateAndDrawConfetti() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.35;
                p.rot += p.vRot;
                p.alpha -= 0.015;

                if (p.alpha <= 0) {
                    confettiParticles.splice(i, 1);
                    continue;
                }

                fxCtx.save();
                fxCtx.globalAlpha = p.alpha;
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate((p.rot * Math.PI) / 180);
                fxCtx.fillStyle = p.color;
                fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                fxCtx.restore();
            }
            requestAnimationFrame(updateAndDrawConfetti);
        }
        requestAnimationFrame(updateAndDrawConfetti);

        /* 도장 & 진행 로직 */
        function updateStarBoard() {
            for (let i = 0; i < 5; i++) {
                const star = document.getElementById(`star-${i}`);
                if (i < starCount) {
                    star.classList.add('earned');
                } else {
                    star.classList.remove('earned');
                }
            }
            crownBadge.textContent = crownCount > 0 ? `👑×${crownCount}` : '';
        }

        function finishLetter() {
            soundSuccess();
            fireConfetti();
            starCount++;

            if (starCount >= 5) {
                crownCount++;
                updateStarBoard();
                
                stampBoardBox.classList.add('celebrate');
                setTimeout(() => {
                    stampBoardBox.classList.remove('celebrate');
                    starCount = 0;
                    updateStarBoard();
                }, 700);
            } else {
                updateStarBoard();
            }

            setTimeout(() => {
                nextWord();
            }, 350);
        }

        /* 칠판 & 드로잉 */
        palette.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-dot')) {
                document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
                e.target.classList.add('active');
                currentColor = e.target.getAttribute('data-color');
            }
        });

        function fitCanvas() {
            const rect = board.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }

        function renderWord(word) {
            const oldBoxes = board.querySelectorAll('.char-box');
            oldBoxes.forEach(b => b.remove());

            const charCount = word.length;
            const boardHeight = board.clientHeight;
            
            const fontSize = Math.min(boardHeight * 0.72, (board.clientWidth / charCount) * 0.85);
            baseLineWidth = Math.max(4, Math.min(10, Math.round(11 / Math.sqrt(charCount))));

            for (let i = 0; i < charCount; i++) {
                const box = document.createElement('div');
                box.className = 'char-box';

                const charSpan = document.createElement('span');
                charSpan.className = 'guide-char';
                charSpan.textContent = word[i];
                charSpan.style.fontSize = `${fontSize}px`;

                box.appendChild(charSpan);
                board.insertBefore(box, canvas);
            }

            pageBadge.textContent = `${currentIndex + 1} / ${currentWords.length}`;
            clearCanvas(false);
            speakCurrentWord();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        let lastDrawPos = { x: 0, y: 0 };

        function startDraw(e) {
            isDrawing = true;
            canvas.setPointerCapture(e.pointerId);
            const pos = getPos(e);
            lastDrawPos = pos;
            playChimeNote();

            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.strokeStyle = currentColor;

            if (e.pressure && e.pressure > 0) {
                ctx.lineWidth = Math.max(baseLineWidth * 0.8, e.pressure * (baseLineWidth * 1.4));
            } else {
                ctx.lineWidth = baseLineWidth;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);

            const dist = Math.hypot(pos.x - lastDrawPos.x, pos.y - lastDrawPos.y);
            if (dist > 18) {
                playChimeNote();
                lastDrawPos = pos;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function endDraw(e) {
            if (!isDrawing) return;
            isDrawing = false;
            ctx.closePath();
            try {
                canvas.releasePointerCapture(e.pointerId);
            } catch (err) {}
        }

        canvas.addEventListener('pointerdown', startDraw);
        canvas.addEventListener('pointermove', moveDraw);
        canvas.addEventListener('pointerup', endDraw);
        canvas.addEventListener('pointercancel', endDraw);

        function clearCanvas(playSound = true) {
            if (playSound) soundClear();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % currentWords.length;
            renderWord(currentWords[currentIndex]);
        }

        function prevWord() {
            currentIndex = (currentIndex - 1 + currentWords.length) % currentWords.length;
            renderWord(currentWords[currentIndex]);
        }

        function updateLayout() {
            fitCanvas();
            renderWord(currentWords[currentIndex]);
        }

        initCategoryBar();
        window.addEventListener('resize', updateLayout);
        window.addEventListener('orientationchange', () => {
            setTimeout(updateLayout, 150);
        });
        document.fonts.ready.then(updateLayout);
    </script>
</body>
</html>
