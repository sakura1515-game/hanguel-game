<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>알록달록 한글 단어 놀이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@800&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    
    <script src="words.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 8px;
            background-color: #fef8ee;
            font-family: 'Gaegu', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none;
            overflow: hidden;
        }

        /* 1. 카테고리 선택 탭바 (가로 스크롤 가능) */
        .category-scroll-container {
            width: 100%;
            max-width: 560px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 6px;
            padding: 4px 2px 8px 2px;
            scrollbar-width: none; /* 파이어폭스 스크롤 숨김 */
        }
        .category-scroll-container::-webkit-scrollbar {
            display: none; /* 크롬/사파리 스크롤 숨김 */
        }

        .category-btn {
            background-color: #ffffff;
            border: 2px solid #ffd166;
            border-bottom: 4px solid #e0ab34;
            color: #634200;
            font-family: 'Gaegu', cursive;
            font-size: 17px;
            font-weight: bold;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .category-btn.active {
            background-color: #ff7675;
            color: #ffffff;
            border-color: #d63031;
            border-bottom: 4px solid #c0392b;
            transform: scale(1.05);
        }

        .category-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        /* 2. 상단 별 도장판 & 진행 현황 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(92vw, 560px);
            margin-bottom: 6px;
        }

        .stamp-board {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            border: 2px solid #ffd166;
            box-shadow: 0 3px 6px rgba(0,0,0,0.04);
        }

        .stamp-title {
            font-size: 16px;
            font-weight: bold;
            color: #d97706;
        }

        .stamp-star {
            font-size: 18px;
            color: #e5e7eb;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s;
        }

        .stamp-star.earned {
            color: #fbbf24;
            transform: scale(1.2);
            filter: drop-shadow(0 2px 4px rgba(251, 191, 36, 0.5));
        }

        .page-badge {
            background: #ffffff;
            border: 2px solid #dcdde1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #57606f;
        }

        /* 3. 팔레트 및 소리 버튼 */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .palette-container {
            display: flex;
            gap: 6px;
            background: #ffffff;
            padding: 4px 10px;
            border-radius: 40px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            border: 2px solid #f0e6d6;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
            transition: transform 0.15s ease;
        }

        .color-dot.active {
            transform: scale(1.2);
            border-color: #4a3427;
        }

        .btn-speaker {
            background: #fff;
            border: 2px solid #ffd166;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

        .btn-speaker:active {
            transform: scale(0.92);
        }

        /* 4. 칠판 프레임 */
        .board-frame {
            position: relative;
            padding: 8px;
            border-radius: 24px;
            background: linear-gradient(135deg, #ff7675, #fab1a0, #ffeaa7, #55efc4, #81ecec, #74b9ff, #a29bfe);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        #game-board {
            width: min(92vw, 560px);
            height: min(50vw, 280px);
            background-color: #ffffff;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .char-box {
            flex: 1;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1.5px dashed #e2e8f0;
        }

        .char-box:last-child {
            border-right: none;
        }

        .char-box::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1.5px dashed #e2e8f0;
            pointer-events: none;
        }

        .char-box::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            border-left: 1.5px dashed #e2e8f0;
            pointer-events: none;
        }

        .guide-char {
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            color: #dcdde1;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            letter-spacing: -2px;
        }

        #draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            touch-action: none;
        }

        /* 5. 하단 버튼 */
        .btn-group {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            border: 2px solid #333;
            border-bottom: 4px solid #222;
            padding: 7px 18px;
            font-family: 'Gaegu', cursive;
            font-size: 19px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.1s;
        }

        button.action-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-prev { background-color: #68d8d6; color: #1a4a49; }
        .btn-clear { background-color: #ffd166; color: #5c4200; }
        .btn-done { background-color: #ff9ff3; color: #57004f; }
        .btn-next { background-color: #06d6a0; color: #034b38; }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* 보상 팝업 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: white;
            padding: 24px 32px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 16px 32px rgba(0,0,0,0.2);
            border: 4px solid #ffd166;
            transform: scale(0.8);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-box {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 54px;
            margin-bottom: 6px;
            animation: bounce 0.6s infinite alternate ease-in-out;
        }

        .modal-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 14px;
            white-space: pre-line;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="category-scroll-container" id="category-bar"></div>

    <div class="status-bar">
        <div class="stamp-board">
            <span class="stamp-title">⭐ 도장</span>
            <span class="stamp-star" id="star-0">★</span>
            <span class="stamp-star" id="star-1">★</span>
            <span class="stamp-star" id="star-2">★</span>
            <span class="stamp-star" id="star-3">★</span>
            <span class="stamp-star" id="star-4">★</span>
        </div>
        <div class="page-badge" id="page-badge">1 / 1</div>
    </div>

    <div class="top-bar">
        <div class="palette-container" id="palette">
            <div class="color-dot active" style="background-color: #ff4757;" data-color="#ff4757"></div>
            <div class="color-dot" style="background-color: #ffa502;" data-color="#ffa502"></div>
            <div class="color-dot" style="background-color: #2ed573;" data-color="#2ed573"></div>
            <div class="color-dot" style="background-color: #1e90ff;" data-color="#1e90ff"></div>
            <div class="color-dot" style="background-color: #9b59b6;" data-color="#9b59b6"></div>
            <div class="color-dot" style="background-color: #2f3542;" data-color="#2f3542"></div>
        </div>
        <div class="btn-speaker" onclick="speakCurrentWord()" title="소리 듣기">🔊</div>
    </div>

    <div class="board-frame">
        <div id="game-board">
            <canvas id="draw-canvas"></canvas>
        </div>
    </div>

    <div class="btn-group">
        <button class="action-btn btn-prev" onclick="prevWord()">◀ 이전</button>
        <button class="action-btn btn-clear" onclick="clearCanvas()">🧼 지우기</button>
        <button class="action-btn btn-done" onclick="finishLetter()">✨ 완성!</button>
        <button class="action-btn btn-next" onclick="nextWord()">다음 ▶</button>
    </div>

    <canvas id="fx-canvas"></canvas>

    <div class="modal-overlay" id="reward-modal" onclick="closeRewardModal()">
        <div class="modal-box">
            <div class="modal-icon" id="modal-icon">👑</div>
            <div class="modal-text" id="modal-text">별 5개 완성! 최고야!</div>
            <button class="action-btn btn-next" style="margin: 0 auto;">계속하기 💖</button>
        </div>
    </div>

    <script>
        // 기본 데이터 백업
        const defaultCategories = {
            "가나다": ["가", "나", "다", "라", "마", "바", "사"],
            "예쁜 이름": ["연아", "시우", "지우"],
            "우리 가족": ["엄마", "아빠", "사랑해"]
        };

        const categories = (typeof wordCategories !== 'undefined') ? wordCategories : defaultCategories;
        const categoryKeys = Object.keys(categories);

        let currentCategoryKey = categoryKeys[0];
        let currentWords = categories[currentCategoryKey] || ["가"];
        let currentIndex = 0;
        let isDrawing = false;
        let currentColor = '#ff4757';
        let baseLineWidth = 7;
        let starCount = 0;

        const board = document.getElementById('game-board');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const palette = document.getElementById('palette');
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        const categoryBar = document.getElementById('category-bar');
        const pageBadge = document.getElementById('page-badge');

        /* ---------------- 카테고리 탭 생성 및 전환 ---------------- */
        function initCategoryBar() {
            categoryBar.innerHTML = '';
            categoryKeys.forEach(catName => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${catName === currentCategoryKey ? 'active' : ''}`;
                btn.textContent = catName;
                btn.onclick = () => selectCategory(catName);
                categoryBar.appendChild(btn);
            });
        }

        function selectCategory(catName) {
            currentCategoryKey = catName;
            currentWords = categories[catName] || ["가"];
            currentIndex = 0;

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === catName);
            });

            renderWord(currentWords[currentIndex]);
        }

        /* ---------------- Web Audio 사운드 시스템 ---------------- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const chimeNotes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        let noteIndex = 0;
        let lastToneTime = 0;

        function playChimeNote() {
            const now = Date.now();
            if (now - lastToneTime < 85) return;
            lastToneTime = now;

            if (audioCtx.state === 'suspended') audioCtx.resume();

            const freq = chimeNotes[noteIndex % chimeNotes.length];
            noteIndex++;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.22);
        }

        function playTone(freq, type, duration, startDelay = 0) {
            setTimeout(() => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, startDelay);
        }

        function soundSuccess() {
            playTone(523.25, 'triangle', 0.15, 0);
            playTone(659.25, 'triangle', 0.15, 100);
            playTone(783.99, 'triangle', 0.15, 200);
            playTone(1046.50, 'triangle', 0.35, 300);
        }

        function soundClear() {
            playTone(320, 'sine', 0.12, 0);
            playTone(220, 'sine', 0.15, 80);
        }

        /* ---------------- 음성 읽어주기 (TTS) ---------------- */
        function speakCurrentWord() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const text = currentWords[currentIndex];
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ko-KR';
            utter.rate = 0.85;
            utter.pitch = 1.25;
            window.speechSynthesis.speak(utter);
        }

        /* ---------------- 폭죽 효과 ---------------- */
        let confettiParticles = [];
        function fireConfetti() {
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#ffd32a'];
            for (let i = 0; i < 45; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.8) * 16,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    alpha: 1
                });
            }
        }

        function updateAndDrawConfetti() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.35;
                p.rot += p.vRot;
                p.alpha -= 0.015;

                if (p.alpha <= 0) {
                    confettiParticles.splice(i, 1);
                    continue;
                }

                fxCtx.save();
                fxCtx.globalAlpha = p.alpha;
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate((p.rot * Math.PI) / 180);
                fxCtx.fillStyle = p.color;
                fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                fxCtx.restore();
            }
            requestAnimationFrame(updateAndDrawConfetti);
        }
        requestAnimationFrame(updateAndDrawConfetti);

        /* ---------------- 별 도장 & 보상 ---------------- */
        function updateStarBoard() {
            for (let i = 0; i < 5; i++) {
                const star = document.getElementById(`star-${i}`);
                if (i < starCount) {
                    star.classList.add('earned');
                } else {
                    star.classList.remove('earned');
                }
            }
        }

        function finishLetter() {
            soundSuccess();
            fireConfetti();
            starCount++;
            if (starCount >= 5) {
                updateStarBoard();
                setTimeout(() => {
                    showRewardModal('👑', '별 5개 완성!\n오늘 한글 왕이에요!');
                    starCount = 0;
                }, 400);
            } else {
                updateStarBoard();
                setTimeout(() => {
                    nextWord();
                }, 600);
            }
        }

        function showRewardModal(icon, text) {
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('reward-modal').classList.add('show');
        }

        function closeRewardModal() {
            document.getElementById('reward-modal').classList.remove('show');
            updateStarBoard();
            nextWord();
        }

        /* ---------------- 칠판 & 드로잉 ---------------- */
        palette.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-dot')) {
                document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
                e.target.classList.add('active');
                currentColor = e.target.getAttribute('data-color');
            }
        });

        function fitCanvas() {
            const rect = board.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }

        function renderWord(word) {
            const oldBoxes = board.querySelectorAll('.char-box');
            oldBoxes.forEach(b => b.remove());

            const charCount = word.length;
            const boardHeight = board.clientHeight;
            
            const fontSize = Math.min(boardHeight * 0.72, (board.clientWidth / charCount) * 0.85);
            baseLineWidth = Math.max(4, Math.min(10, Math.round(11 / Math.sqrt(charCount))));

            for (let i = 0; i < charCount; i++) {
                const box = document.createElement('div');
                box.className = 'char-box';

                const charSpan = document.createElement('span');
                charSpan.className = 'guide-char';
                charSpan.textContent = word[i];
                charSpan.style.fontSize = `${fontSize}px`;

                box.appendChild(charSpan);
                board.insertBefore(box, canvas);
            }

            pageBadge.textContent = `${currentIndex + 1} / ${currentWords.length}`;
            clearCanvas(false);
            speakCurrentWord();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        let lastDrawPos = { x: 0, y: 0 };

        function startDraw(e) {
            isDrawing = true;
            canvas.setPointerCapture(e.pointerId);
            const pos = getPos(e);
            lastDrawPos = pos;
            playChimeNote();

            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.strokeStyle = currentColor;

            if (e.pressure && e.pressure > 0) {
                ctx.lineWidth = Math.max(baseLineWidth * 0.8, e.pressure * (baseLineWidth * 1.4));
            } else {
                ctx.lineWidth = baseLineWidth;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);

            const dist = Math.hypot(pos.x - lastDrawPos.x, pos.y - lastDrawPos.y);
            if (dist > 18) {
                playChimeNote();
                lastDrawPos = pos;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function endDraw(e) {
            if (!isDrawing) return;
            isDrawing = false;
            ctx.closePath();
            try {
                canvas.releasePointerCapture(e.pointerId);
            } catch (err) {}
        }

        canvas.addEventListener('pointerdown', startDraw);
        canvas.addEventListener('pointermove', moveDraw);
        canvas.addEventListener('pointerup', endDraw);
        canvas.addEventListener('pointercancel', endDraw);

        function clearCanvas(playSound = true) {
            if (playSound) soundClear();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % currentWords.length;
            renderWord(currentWords[currentIndex]);
        }

        function prevWord() {
            currentIndex = (currentIndex - 1 + currentWords.length) % currentWords.length;
            renderWord(currentWords[currentIndex]);
        }

        function updateLayout() {
            fitCanvas();
            renderWord(currentWords[currentIndex]);
        }

        // 초기 시작
        initCategoryBar();
        window.addEventListener('resize', updateLayout);
        document.fonts.ready.then(updateLayout);
    </script>
</body>
</html>
