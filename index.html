<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>알록달록 한글 놀이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: #fef8ee;
            font-family: 'Gaegu', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .lobby-container {
            text-align: center;
            width: 100%;
            max-width: 480px;
        }

        .lobby-title {
            font-size: clamp(34px, 8vw, 46px);
            color: #d97706;
            margin: 0 0 8px 0;
            text-shadow: 2px 2px 0px #ffd166;
        }

        .lobby-subtitle {
            font-size: clamp(18px, 4.5vw, 22px);
            color: #718096;
            margin: 0 0 32px 0;
        }

        .game-menu-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        .menu-card-btn {
            background: #ffffff;
            border: 3px solid #ffd166;
            border-bottom: 6px solid #e0ab34;
            border-radius: 24px;
            padding: 18px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            transition: transform 0.1s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            color: inherit;
        }

        .menu-card-btn:active {
            transform: translateY(3px);
            border-bottom-width: 3px;
        }

        .menu-icon {
            font-size: 42px;
            background: #fff9db;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-info {
            text-align: left;
        }

        .menu-info h3 {
            margin: 0 0 4px 0;
            font-size: 24px;
            color: #2d3748;
        }

        .menu-info p {
            margin: 0;
            font-size: 17px;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="lobby-container">
        <h1 class="lobby-title">🌟 알록달록 한글 놀이터 🌟</h1>
        <p class="lobby-subtitle">하고 싶은 한글 놀이를 골라보세요!</p>

        <div class="game-menu-grid">
            <a href="write.html" class="menu-card-btn">
                <div class="menu-icon">✍️</div>
                <div class="menu-info">
                    <h3>칠판에 글자 쓰기</h3>
                    <p>알록달록 펜으로 따라 써요</p>
                </div>
            </a>

            <a href="puzzle.html" class="menu-card-btn">
                <div class="menu-icon">🧩</div>
                <div class="menu-info">
                    <h3>자석 글자 조립하기</h3>
                    <p>자음과 모음을 쏙쏙 합체해요</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
