<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>자석 글자 조립하기</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@800&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <script src="words.js?v=9.0"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 8px; background-color: #fef8ee;
            font-family: 'Gaegu', cursive, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; min-height: 100vh; min-height: 100dvh;
            touch-action: none; overflow-x: hidden;
        }
        .header-bar {
            width: min(94vw, 560px); display: flex;
            align-items: center; justify-content: space-between; margin-bottom: 6px;
        }
        .btn-home {
            background: #ffffff; border: 2px solid #cbd5e1; border-bottom: 3px solid #94a3b8;
            font-family: 'Gaegu'; font-size: 16px; font-weight: bold;
            color: #475569; padding: 4px 12px; border-radius: 14px; text-decoration: none;
        }
        .btn-home:active { transform: translateY(2px); border-bottom-width: 1px; }
        .category-scroll {
            width: min(94vw, 560px); overflow-x: auto; white-space: nowrap;
            display: flex; gap: 6px; padding-bottom: 6px; scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .category-btn {
            background: #fff; border: 2px solid #ffd166; border-bottom: 3px solid #e0ab34;
            color: #634200; font-family: 'Gaegu'; font-size: 15px; font-weight: bold;
            padding: 4px 12px; border-radius: 16px; cursor: pointer; flex-shrink: 0;
        }
        .category-btn.active {
            background: #ff7675; color: #fff; border-color: #d63031; border-bottom: 3px solid #c0392b;
        }
        .status-bar {
            width: min(94vw, 560px); display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 6px;
        }
        .stamp-board {
            display: flex; align-items: center; gap: 4px; background: #fff;
            padding: 3px 10px; border-radius: 20px; border: 2px solid #ffd166;
        }
        .stamp-title { font-size: 15px; font-weight: bold; color: #d97706; }
        .stamp-star { font-size: 16px; color: #e5e7eb; transition: transform 0.2s; }
        .stamp-star.earned { color: #fbbf24; transform: scale(1.2); }
        .crown-badge { font-size: 15px; font-weight: bold; color: #d97706; margin-left: 2px; }
        .board-frame {
            position: relative; padding: 6px; border-radius: 22px;
            background: linear-gradient(135deg, #ff7675, #fab1a0, #ffeaa7, #55efc4, #81ecec, #74b9ff, #a29bfe);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08); width: min(94vw, 560px);
        }
        .puzzle-board {
            width: 100%; min-height: 170px; background: #fff; border-radius: 16px;
            padding: 10px 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
        }
        .target-word-display {
            display: flex; align-items: center; gap: 6px; background: #fff4e6;
            border: 2px dashed #ffa94d; padding: 4px 14px; border-radius: 30px;
        }
        .target-text { font-family: 'Nanum Gothic'; font-size: 24px; font-weight: 800; color: #2b2b2b; }
        .btn-speaker {
            background: #fff; border: 2px solid #ffd166; width: 32px; height: 32px;
            border-radius: 50%; font-size: 16px; display: flex; align-items: center;
            justify-content: center; cursor: pointer;
        }
        .word-slots-container {
            display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .char-slot-group {
            display: flex; flex-direction: column; align-items: center;
            background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 14px;
            padding: 6px 8px; gap: 4px;
        }
        .char-guide-label { font-family: 'Nanum Gothic'; font-size: 14px; font-weight: 800; color: #adb5bd; }
        .jamo-slots-row { display: flex; gap: 5px; }
        .drop-slot {
            width: 48px; height: 48px; background: #fff; border: 2px dashed #ced4da;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
        }
        .drop-slot.filled { border-style: solid; border-color: #40c057; background: #ebfbee; }
        .drop-slot-hint { font-family: 'Nanum Gothic'; font-size: 17px; color: #d1d5db; font-weight: bold; pointer-events: none; }
        .magnet-tray {
            width: min(94vw, 560px); background: #fff; border: 2px solid #e5e7eb;
            border-radius: 18px; padding: 10px; display: flex; flex-wrap: wrap;
            align-items: center; justify-content: center; gap: 8px; min-height: 70px;
            margin-top: 8px;
        }
        .magnet-piece {
            width: 46px; height: 46px; border-radius: 12px; display: flex;
            align-items: center; justify-content: center; font-family: 'Nanum Gothic';
            font-size: 22px; font-weight: 800; color: #fff; cursor: grab;
            box-shadow: 0 4px 0 rgba(0,0,0,0.18); touch-action: none;
        }
        .magnet-piece.consonant { background: linear-gradient(135deg, #4dabf7, #339af0); border: 2px solid #1c7ed6; }
        .magnet-piece.vowel { background: linear-gradient(135deg, #ff8787, #fa5252); border: 2px solid #e03131; }
        .btn-group { margin-top: 10px; display: flex; gap: 8px; }
        button.action-btn {
            border: 2px solid #333; border-bottom: 4px solid #222; padding: 6px 16px;
            font-family: 'Gaegu'; font-size: 18px; font-weight: bold; border-radius: 14px;
            cursor: pointer;
        }
        button.action-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .btn-prev { background: #68d8d6; }
        .btn-reset { background: #ffd166; }
        .btn-next { background: #06d6a0; }
        #fx-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
    </style>
</head>
<body>
    <div class="header-bar">
        <a href="index.html" class="btn-home">🏠 홈으로</a>
        <span style="font-size: 15px; font-weight: bold; color: #57606f;" id="page-badge">1 / 1</span>
    </div>

    <div class="category-scroll" id="category-bar"></div>

    <div class="status-bar">
        <div class="stamp-board" id="stamp-board">
            <span class="stamp-title">⭐ 도장</span>
            <span class="stamp-star" id="star-0">★</span>
            <span class="stamp-star" id="star-1">★</span>
            <span class="stamp-star" id="star-2">★</span>
            <span class="stamp-star" id="star-3">★</span>
            <span class="stamp-star" id="star-4">★</span>
            <span class="crown-badge" id="crown-badge"></span>
        </div>
    </div>

    <div class="board-frame">
        <div class="puzzle-board">
            <div class="target-word-display">
                <span style="font-size: 16px; color: #d9480f; font-weight: bold;">단어 만들기 ➔</span>
                <span class="target-text" id="target-word-text">사과</span>
                <div class="btn-speaker" onclick="speakCurrentWord()">🔊</div>
            </div>
            <div class="word-slots-container" id="word-slots-container"></div>
        </div>
    </div>

    <div class="magnet-tray" id="magnet-tray"></div>

    <div class="btn-group">
        <button class="action-btn btn-prev" onclick="prevWord()">◀ 이전</button>
        <button class="action-btn btn-reset" onclick="resetPuzzle()">🔄 다시하기</button>
        <button class="action-btn btn-next" onclick="nextWord()">다음 ▶</button>
    </div>

    <canvas id="fx-canvas"></canvas>

    <script>
        const categories = (typeof wordCategories !== 'undefined') ? wordCategories : { "가나다": ["가", "나", "다"] };
        const categoryKeys = Object.keys(categories);
        let currentCategoryKey = categoryKeys[0];
        let currentWords = categories[currentCategoryKey];
        let currentIndex = 0, starCount = 0, crownCount = 0, isPuzzleCompleted = false;

        const CHOSUNG = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
        const JUNGSUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
        const JONGSUNG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
        const VOWELS = new Set(JUNGSUNG);

        function decomposeChar(c) {
            const code = c.charCodeAt(0) - 0xAC00;
            if (code < 0 || code > 11171) return [c];
            const cho = CHOSUNG[Math.floor(code / 588)];
            const jung = JUNGSUNG[Math.floor((code % 588) / 28)];
            const jong = JONGSUNG[code % 28];
            return jong ? [cho, jung, jong] : [cho, jung];
        }

        function initCategoryBar() {
            const bar = document.getElementById('category-bar');
            bar.innerHTML = '';
            categoryKeys.forEach(catName => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${catName === currentCategoryKey ? 'active' : ''}`;
                btn.textContent = catName;
                btn.onclick = () => {
                    currentCategoryKey = catName; currentWords = categories[catName]; currentIndex = 0;
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.toggle('active', b.textContent === catName));
                    renderWord(currentWords[currentIndex]);
                };
                bar.appendChild(btn);
            });
        }

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, type, duration, delay = 0, vol = 0.35) {
            setTimeout(() => {
                const actx = getAudioContext();
                const osc = actx.createOscillator(), gain = actx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, actx.currentTime);
                gain.gain.setValueAtTime(vol, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
                osc.connect(gain); gain.connect(actx.destination);
                osc.start(); osc.stop(actx.currentTime + duration);
            }, delay);
        }

        function speakCurrentWord() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(currentWords[currentIndex]);
            utter.lang = 'ko-KR'; utter.rate = 0.85; utter.pitch = 1.25;
            window.speechSynthesis.speak(utter);
        }

        const fxCanvas = document.getElementById('fx-canvas'), fxCtx = fxCanvas.getContext('2d');
        let confetti = [];
        function fireConfetti(n = 45) {
            const cols = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6'];
            for (let i = 0; i < n; i++) {
                confetti.push({
                    x: window.innerWidth / 2, y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.8) * 16,
                    size: Math.random() * 8 + 6, color: cols[Math.floor(Math.random() * cols.length)],
                    rot: Math.random() * 360, vRot: (Math.random() - 0.5) * 10, alpha: 1
                });
            }
        }

        function drawConfetti() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = confetti.length - 1; i >= 0; i--) {
                const p = confetti[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.rot += p.vRot; p.alpha -= 0.015;
                if (p.alpha <= 0) { confetti.splice(i, 1); continue; }
                fxCtx.save(); fxCtx.globalAlpha = p.alpha; fxCtx.translate(p.x, p.y);
                fxCtx.rotate((p.rot * Math.PI) / 180); fxCtx.fillStyle = p.color;
                fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); fxCtx.restore();
            }
            requestAnimationFrame(drawConfetti);
        }
        requestAnimationFrame(drawConfetti);

        function updateStarBoard() {
            for (let i = 0; i < 5; i++) {
                document.getElementById(`star-${i}`).classList.toggle('earned', i < starCount);
            }
            document.getElementById('crown-badge').textContent = crownCount > 0 ? `👑×${crownCount}` : '';
        }

        function handleSuccess() {
            playTone(523.25, 'triangle', 0.15, 0); playTone(659.25, 'triangle', 0.15, 100);
            playTone(783.99, 'triangle', 0.15, 200); playTone(1046.50, 'triangle', 0.35, 300);
            fireConfetti();
            if (++starCount >= 5) {
                crownCount++; updateStarBoard();
                setTimeout(() => { starCount = 0; updateStarBoard(); }, 700);
            } else updateStarBoard();
            setTimeout(nextWord, 600);
        }

        const slotsContainer = document.getElementById('word-slots-container');
        const tray = document.getElementById('magnet-tray');

        function renderWord(word) {
            isPuzzleCompleted = false;
            document.getElementById('target-word-text').textContent = word;
            document.getElementById('page-badge').textContent = `${currentIndex + 1} / ${currentWords.length}`;
            slotsContainer.innerHTML = ''; tray.innerHTML = '';

            let correctJamos = [], slotIdx = 0;
            for (let i = 0; i < word.length; i++) {
                const char = word[i], jamos = decomposeChar(char);
                const group = document.createElement('div'); group.className = 'char-slot-group';
                const label = document.createElement('div'); label.className = 'char-guide-label';
                label.textContent = `[ ${char} ]`; group.appendChild(label);
                const row = document.createElement('div'); row.className = 'jamo-slots-row';

                jamos.forEach(jamo => {
                    const slot = document.createElement('div'); slot.className = 'drop-slot';
                    slot.dataset.expected = jamo; slot.dataset.slotId = `s-${slotIdx++}`;
                    const hint = document.createElement('span'); hint.className = 'drop-slot-hint';
                    hint.textContent = jamo; slot.appendChild(hint);
                    setupSlotEvents(slot); row.appendChild(slot); correctJamos.push(jamo);
                });
                group.appendChild(row); slotsContainer.appendChild(group);
            }

            const distractors = ["ㄱ", "ㄴ", "ㄷ", "ㄹ", "ㅁ", "ㅂ", "ㅅ", "ㅇ", "ㅏ", "ㅓ", "ㅗ", "ㅜ", "ㅣ"];
            let pieces = [...correctJamos];
            for (let k = 0; k < 2; k++) pieces.push(distractors[Math.floor(Math.random() * distractors.length)]);
            pieces.sort(() => Math.random() - 0.5);

            pieces.forEach((jamo, idx) => {
                const piece = createPiece(jamo, `p-${idx}`);
                tray.appendChild(piece);
            });
            speakCurrentWord();
        }

        function createPiece(jamo, id) {
            const el = document.createElement('div');
            el.className = `magnet-piece ${VOWELS.has(jamo) ? 'vowel' : 'consonant'}`;
            el.textContent = jamo; el.id = id; el.dataset.jamo = jamo; el.draggable = true;

            el.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', el.id));
            el.addEventListener('pointerdown', (e) => {
                let moved = false; const startX = e.clientX, startY = e.clientY;
                function onMove(me) { if (Math.hypot(me.clientX - startX, me.clientY - startY) > 8) moved = true; }
                function onUp(ue) {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    if (!moved) {
                        const target = Array.from(document.querySelectorAll('.drop-slot')).find(
                            s => !s.dataset.filled && s.dataset.expected === el.dataset.jamo
                        );
                        if (target) snapPiece(el, target);
                        return;
                    }
                    const below = document.elementFromPoint(ue.clientX, ue.clientY);
                    const slot = below ? below.closest('.drop-slot') : null;
                    if (slot && !slot.dataset.filled && slot.dataset.expected === el.dataset.jamo) {
                        snapPiece(el, slot);
                    }
                }
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            });
            return el;
        }

        function setupSlotEvents(slot) {
            slot.addEventListener('dragover', (e) => e.preventDefault());
            slot.addEventListener('drop', (e) => {
                e.preventDefault();
                if (slot.dataset.filled) return;
                const piece = document.getElementById(e.dataTransfer.getData('text/plain'));
                if (piece && piece.dataset.jamo === slot.dataset.expected) snapPiece(piece, slot);
            });
        }

        function snapPiece(piece, slot) {
            playTone(480, 'sine', 0.08, 0); playTone(720, 'sine', 0.12, 40);
            slot.classList.add('filled'); slot.dataset.filled = "true";
            const hint = slot.querySelector('.drop-slot-hint'); if (hint) hint.style.display = 'none';
            slot.appendChild(piece); piece.draggable = false; piece.style.cursor = 'default';

            const all = document.querySelectorAll('.drop-slot');
            if (Array.from(all).every(s => s.dataset.filled) && !isPuzzleCompleted) {
                isPuzzleCompleted = true; handleSuccess();
            }
        }

        function resetPuzzle() { renderWord(currentWords[currentIndex]); }
        function nextWord() { currentIndex = (currentIndex + 1) % currentWords.length; renderWord(currentWords[currentIndex]); }
        function prevWord() { currentIndex = (currentIndex - 1 + currentWords.length) % currentWords.length; renderWord(currentWords[currentIndex]); }

        initCategoryBar();
        window.addEventListener('resize', () => { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; });
        fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight;
        renderWord(currentWords[currentIndex]);
    </script>
</body>
</html>
