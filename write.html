<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>칠판에 글자 쓰기</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@800&family=Gaegu:wght@700&display=swap" rel="stylesheet">
    <script src="words.js?v=18.0"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 8px;
            background-color: #fef8ee;
            font-family: 'Gaegu', cursive, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            touch-action: none;
            overflow: hidden;
        }

        /* 1. 카테고리 선택 바 */
        .category-scroll-container {
            width: 100%;
            max-width: 580px;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 6px;
            padding: 2px 4px 6px 4px;
            scrollbar-width: none;
            flex-shrink: 0;
        }
        .category-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            background-color: #ffffff;
            border: 2px solid #ffd166;
            border-bottom: 3px solid #e0ab34;
            color: #634200;
            font-family: 'Gaegu', cursive;
            font-size: 16px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .category-btn.active {
            background-color: #ff7675;
            color: #ffffff;
            border-color: #d63031;
            border-bottom: 3px solid #c0392b;
            transform: scale(1.04);
        }

        .category-btn:active {
            transform: translateY(2px);
            border-bottom-width: 1px;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 580px;
        }

        /* 2. 상단 상태창 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(92vw, 560px);
            margin-bottom: 6px;
            flex-shrink: 0;
            position: relative;
        }

        .stamp-board {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            border: 2px solid #ffd166;
            box-shadow: 0 3px 6px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
        }

        .stamp-board.celebrate {
            transform: scale(1.1);
            background-color: #fff9db;
            border-color: #f59f00;
        }

        .stamp-title {
            font-size: 15px;
            font-weight: bold;
            color: #d97706;
        }

        .stamp-star {
            font-size: 17px;
            color: #e5e7eb;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.25s;
        }

        .stamp-star.earned {
            color: #fbbf24;
            transform: scale(1.2);
            filter: drop-shadow(0 2px 4px rgba(251, 191, 36, 0.5));
        }

        .crown-badge {
            font-size: 16px;
            font-weight: bold;
            color: #d97706;
            margin-left: 4px;
        }

        .header-left-tools {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-bottom: 3px solid #94a3b8;
            font-family: 'Gaegu', cursive;
            font-size: 15px;
            font-weight: bold;
            color: #475569;
            padding: 3px 10px;
            border-radius: 14px;
            text-decoration: none;
        }

        .btn-home:active {
            transform: translateY(2px);
            border-bottom-width: 1px;
        }

        .page-badge {
            background: #ffffff;
            border: 2px solid #dcdde1;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #57606f;
        }

        /* 3. 팔레트 & 스피커 바 */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .palette-container {
            display: flex;
            gap: 6px;
            background: #ffffff;
            padding: 4px 8px;
            border-radius: 40px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            border: 2px solid #f0e6d6;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
            transition: transform 0.15s ease;
        }

        .color-dot.active {
            transform: scale(1.18);
            border-color: #4a3427;
        }

        .btn-speaker {
            background: #fff;
            border: 2px solid #ffd166;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        /* 4. 칠판 프레임 */
        .board-frame {
            position: relative;
            padding: 6px;
            border-radius: 22px;
            background: linear-gradient(135deg, #ff7675, #fab1a0, #ffeaa7, #55efc4, #81ecec, #74b9ff, #a29bfe);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            flex-shrink: 0;
            transition: box-shadow 0.3s ease;
        }

        .board-frame.praise-glow {
            box-shadow: 0 0 25px rgba(255, 159, 243, 0.9), 0 0 10px rgba(116, 185, 255, 0.8);
            animation: pulse-glow 1.2s infinite alternate;
        }

        @keyframes pulse-glow {
            from { transform: scale(1); }
            to { transform: scale(1.02); }
        }

        #game-board {
            width: min(92vw, 560px);
            height: min(48vw, 260px);
            background-color: #ffffff;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .char-box {
            flex: 1;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1.5px dashed #e2e8f0;
            transition: background-color 0.3s ease;
        }

        .char-box:last-child {
            border-right: none;
        }

        .char-box.char-done {
            background-color: #f4fce3;
        }

        .char-box::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1.5px dashed #e2e8f0;
            pointer-events: none;
        }

        .char-box::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            border-left: 1.5px dashed #e2e8f0;
            pointer-events: none;
        }

        .guide-char {
            font-family: 'Nanum Gothic', sans-serif;
            font-weight: 800;
            color: #dcdde1;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            letter-spacing: -2px;
            transition: color 0.3s ease;
        }

        .char-box.char-done .guide-char {
            color: #b2f2bb;
        }

        #draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            touch-action: none;
        }

        .praise-toast {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: rgba(255, 107, 129, 0.95);
            color: #fff;
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .praise-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 5. 하단 버튼 */
        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        button.action-btn {
            border: 2px solid #333;
            border-bottom: 4px solid #222;
            padding: 6px 16px;
            font-family: 'Gaegu', cursive;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.1s;
        }

        button.action-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-prev { background-color: #68d8d6; color: #1a4a49; }
        .btn-clear { background-color: #ffd166; color: #5c4200; }
        .btn-done { background-color: #ff9ff3; color: #57004f; }
        .btn-next { background-color: #06d6a0; color: #034b38; }

        .btn-done.ready-bounce {
            animation: bounce-ready 0.6s infinite alternate ease-in-out;
            background-color: #ff4757;
            color: #ffffff;
        }

        @keyframes bounce-ready {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); box-shadow: 0 0 12px rgba(255, 71, 87, 0.6); }
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* 📱 가로 모드 (Landscape) 2단 최적화 레이아웃 */
        @media (orientation: landscape) and (max-height: 520px) {
            body {
                padding: 4px 12px;
                justify-content: space-evenly;
            }

            .category-scroll-container {
                max-width: 95vw;
                padding-bottom: 2px;
            }

            .category-btn {
                font-size: 14px;
                padding: 3px 10px;
                border-radius: 14px;
            }

            .main-layout {
                flex-direction: row;
                align-items: center;
                justify-content: center;
                max-width: 96vw;
                gap: 14px;
            }

            .controls-column {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }

            .status-bar {
                width: 100%;
                margin-bottom: 0;
                gap: 6px;
            }

            .top-bar {
                margin-bottom: 0;
            }

            #game-board {
                width: min(58vw, 480px);
                height: min(65vh, 260px);
            }

            .btn-group {
                margin-top: 2px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                width: 100%;
            }

            button.action-btn {
                padding: 6px 10px;
                font-size: 16px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- 카테고리 탭 목록 -->
    <div class="category-scroll-container" id="category-bar"></div>

    <div class="main-layout">
        <!-- 무지개 칠판 보드 (왼쪽/중앙) -->
        <div class="board-frame" id="board-frame-box">
            <div class="praise-toast" id="praise-toast">🎉 참 잘했어요! 멋져요! 👏</div>
            <div id="game-board">
                <canvas id="draw-canvas"></canvas>
            </div>
        </div>

        <!-- 컨트롤 영역 (가로 모드 시 오른쪽 배치) -->
        <div class="controls-column">
            <!-- 상단 도장판 & 페이지 현황 & 홈 버튼 -->
            <div class="status-bar">
                <div class="header-left-tools">
                    <a href="index.html" class="btn-home">🏠 홈</a>
                    <div class="page-badge" id="page-badge">1 / 1</div>
                </div>
                <div class="stamp-board" id="stamp-board-box">
                    <span class="stamp-title">⭐ 도장</span>
                    <span class="stamp-star" id="star-0">★</span>
                    <span class="stamp-star" id="star-1">★</span>
                    <span class="stamp-star" id="star-2">★</span>
                    <span class="stamp-star" id="star-3">★</span>
                    <span class="stamp-star" id="star-4">★</span>
                    <span class="crown-badge" id="crown-badge"></span>
                </div>
            </div>

            <!-- 팔레트 & 발음 듣기 -->
            <div class="top-bar">
                <div class="palette-container" id="palette">
                    <div class="color-dot" style="background-color: #ff4757;" data-color="#ff4757"></div>
                    <div class="color-dot" style="background-color: #ffa502;" data-color="#ffa502"></div>
                    <div class="color-dot" style="background-color: #2ed573;" data-color="#2ed573"></div>
                    <div class="color-dot active" style="background-color: #1e90ff;" data-color="#1e90ff"></div>
                    <div class="color-dot" style="background-color: #9b59b6;" data-color="#9b59b6"></div>
                    <div class="color-dot" style="background-color: #2f3542;" data-color="#2f3542"></div>
                </div>
                <div class="btn-speaker" onclick="speakText(currentWords[currentIndex])" title="소리 듣기">🔊</div>
            </div>

            <!-- 컨트롤 버튼 -->
            <div class="btn-group">
                <button class="action-btn btn-prev" onclick="prevWord()">◀ 이전</button>
                <button class="action-btn btn-clear" onclick="clearCanvas()">🧼 지우기</button>
                <button class="action-btn btn-done" id="btn-done" onclick="finishLetter()">✨ 완성!</button>
                <button class="action-btn btn-next" onclick="nextWord()">다음 ▶</button>
            </div>
        </div>
    </div>

    <canvas id="fx-canvas"></canvas>

    <script>
        const defaultCategories = {
            "가나다": ["가", "나", "다", "라", "마", "바", "사"],
            "예쁜 이름": ["연아", "시우", "지우"],
            "우리 가족": ["엄마", "아빠", "사랑해"]
        };

        const categories = (typeof wordCategories !== 'undefined') ? wordCategories : defaultCategories;
        const categoryKeys = Object.keys(categories);

        let currentCategoryKey = categoryKeys[0];
        let currentWords = categories[currentCategoryKey] || ["가"];
        let currentIndex = 0;
        let isDrawing = false;
        let currentColor = '#1e90ff';
        let baseLineWidth = 7;
        let starCount = 0;
        let crownCount = 0;

        let charGuideMaps = [];
        let isPraiseGiven = false;

        const board = document.getElementById('game-board');
        const boardFrameBox = document.getElementById('board-frame-box');
        const praiseToast = document.getElementById('praise-toast');
        const btnDone = document.getElementById('btn-done');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const palette = document.getElementById('palette');
        const fxCanvas = document.getElementById('fx-canvas');
        const fxCtx = fxCanvas.getContext('2d');
        const categoryBar = document.getElementById('category-bar');
        const pageBadge = document.getElementById('page-badge');
        const stampBoardBox = document.getElementById('stamp-board-box');
        const crownBadge = document.getElementById('crown-badge');

        function initCategoryBar() {
            categoryBar.innerHTML = '';
            categoryKeys.forEach(catName => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${catName === currentCategoryKey ? 'active' : ''}`;
                btn.textContent = catName;
                btn.onclick = () => selectCategory(catName);
                categoryBar.appendChild(btn);
            });
        }

        function selectCategory(catName) {
            currentCategoryKey = catName;
            currentWords = categories[catName] || ["가"];
            currentIndex = 0;

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === catName);
            });

            renderWord(currentWords[currentIndex]);
        }

        /* 🔊 Web Audio 사운드 시스템 */
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        const chimeNotes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        let noteIndex = 0;
        let lastToneTime = 0;

        function playChimeNote() {
            const now = Date.now();
            if (now - lastToneTime < 85) return;
            lastToneTime = now;

            const actx = getAudioContext();
            const freq = chimeNotes[noteIndex % chimeNotes.length];
            noteIndex++;

            const osc = actx.createOscillator();
            const gain = actx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, actx.currentTime);
            gain.gain.setValueAtTime(0.28, actx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);

            osc.connect(gain);
            gain.connect(actx.destination);

            osc.start();
            osc.stop(actx.currentTime + 0.25);
        }

        function playTone(freq, type, duration, startDelay = 0, volume = 0.35) {
            setTimeout(() => {
                const actx = getAudioContext();
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, actx.currentTime);
                gain.gain.setValueAtTime(volume, actx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);

                osc.connect(gain);
                gain.connect(actx.destination);
                osc.start();
                osc.stop(actx.currentTime + duration);
            }, startDelay);
        }

        function soundCharDone() {
            playTone(523.25, 'sine', 0.12, 0, 0.3);
            playTone(783.99, 'sine', 0.18, 80, 0.35);
        }

        function soundSuccess() {
            playTone(523.25, 'triangle', 0.15, 0, 0.35);
            playTone(659.25, 'triangle', 0.15, 100, 0.35);
            playTone(783.99, 'triangle', 0.15, 200, 0.35);
            playTone(1046.50, 'triangle', 0.35, 300, 0.45);
        }

        function soundClear() {
            playTone(320, 'sine', 0.12, 0, 0.32);
            playTone(220, 'sine', 0.15, 80, 0.32);
        }

        /* 🔊 깨끗하고 또렷한 표준 TTS 발음 */
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ko-KR';
            utter.rate = 1.0;
            utter.pitch = 1.0;
            utter.volume = 1.0;
            window.speechSynthesis.speak(utter);
        }

        /* 폭죽 효과 */
        let confettiParticles = [];
        function fireConfetti(count = 35) {
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#ffd32a'];
            for (let i = 0; i < count; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.8) * 16,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    alpha: 1
                });
            }
        }

        function updateAndDrawConfetti() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.35;
                p.rot += p.vRot;
                p.alpha -= 0.015;

                if (p.alpha <= 0) {
                    confettiParticles.splice(i, 1);
                    continue;
                }

                fxCtx.save();
                fxCtx.globalAlpha = p.alpha;
                fxCtx.translate(p.x, p.y);
                fxCtx.rotate((p.rot * Math.PI) / 180);
                fxCtx.fillStyle = p.color;
                fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                fxCtx.restore();
            }
            requestAnimationFrame(updateAndDrawConfetti);
        }
        requestAnimationFrame(updateAndDrawConfetti);

        /* 별 도장 */
        function updateStarBoard() {
            for (let i = 0; i < 5; i++) {
                const star = document.getElementById(`star-${i}`);
                if (i < starCount) {
                    star.classList.add('earned');
                } else {
                    star.classList.remove('earned');
                }
            }
            crownBadge.textContent = crownCount > 0 ? `👑×${crownCount}` : '';
        }

        function finishLetter() {
            soundSuccess();
            fireConfetti(45);
            speakText(currentWords[currentIndex]);
            starCount++;

            if (starCount >= 5) {
                crownCount++;
                updateStarBoard();
                
                stampBoardBox.classList.add('celebrate');
                setTimeout(() => {
                    stampBoardBox.classList.remove('celebrate');
                    starCount = 0;
                    updateStarBoard();
                }, 700);
            } else {
                updateStarBoard();
            }

            setTimeout(() => {
                nextWord();
            }, 600);
        }

        palette.addEventListener('click', (e) => {
            if (e.target.classList.contains('color-dot')) {
                document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
                e.target.classList.add('active');
                currentColor = e.target.getAttribute('data-color');
            }
        });

        function fitCanvas() {
            const rect = board.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }

        function buildLetterGuideMap(word, fontSize) {
            charGuideMaps = [];
            const w = board.clientWidth;
            const h = board.clientHeight;
            if (w === 0 || h === 0) return;

            const offCanvas = document.createElement('canvas');
            offCanvas.width = w;
            offCanvas.height = h;
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

            const charCount = word.length;
            const colWidth = w / charCount;

            for (let i = 0; i < charCount; i++) {
                offCtx.fillStyle = '#ffffff';
                offCtx.fillRect(0, 0, w, h);

                offCtx.fillStyle = '#000000';
                offCtx.font = `800 ${fontSize}px 'Nanum Gothic'`;
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';

                const cx = colWidth * i + colWidth / 2;
                const cy = h / 2;
                offCtx.fillText(word[i], cx, cy);

                const imgData = offCtx.getImageData(0, 0, w, h).data;
                const points = [];
                const step = 8;

                for (let y = 0; y < h; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const idx = (y * w + x) * 4;
                        if (imgData[idx] < 120) {
                            points.push({ x, y, hit: false });
                        }
                    }
                }

                charGuideMaps.push({
                    char: word[i],
                    charIndex: i,
                    points: points,
                    hitCount: 0,
                    isDone: false
                });
            }
        }

        /* 🎯 적정 수준의 인식 반경 (1.35배) */
        function checkStrokeCoverage(x, y) {
            if (charGuideMaps.length === 0) return;
            const radiusSq = (baseLineWidth * 1.35) ** 2;

            for (let c = 0; c < charGuideMaps.length; c++) {
                const charMap = charGuideMaps[c];
                for (let i = 0; i < charMap.points.length; i++) {
                    const pt = charMap.points[i];
                    if (!pt.hit) {
                        const distSq = (pt.x - x) ** 2 + (pt.y - y) ** 2;
                        if (distSq <= radiusSq) {
                            pt.hit = true;
                            charMap.hitCount++;
                        }
                    }
                }
            }
        }

        function triggerPraiseEffect() {
            isPraiseGiven = true;
            boardFrameBox.classList.add('praise-glow');
            btnDone.classList.add('ready-bounce');
            praiseToast.classList.add('show');

            setTimeout(() => {
                soundSuccess();
                fireConfetti(35);
                speakText(currentWords[currentIndex]);
            }, 750);

            setTimeout(() => {
                praiseToast.classList.remove('show');
            }, 3000);
        }

        function resetPraiseEffect() {
            isPraiseGiven = false;
            boardFrameBox.classList.remove('praise-glow');
            btnDone.classList.remove('ready-bounce');
            praiseToast.classList.remove('show');
        }

        function renderWord(word) {
            resetPraiseEffect();
            const oldBoxes = board.querySelectorAll('.char-box');
            oldBoxes.forEach(b => b.remove());

            const charCount = word.length;
            const boardHeight = board.clientHeight;
            
            const fontSize = Math.min(boardHeight * 0.72, (board.clientWidth / charCount) * 0.85);
            baseLineWidth = Math.max(4, Math.min(10, Math.round(11 / Math.sqrt(charCount))));

            for (let i = 0; i < charCount; i++) {
                const box = document.createElement('div');
                box.className = 'char-box';
                box.dataset.charIndex = i;

                const charSpan = document.createElement('span');
                charSpan.className = 'guide-char';
                charSpan.textContent = word[i];
                charSpan.style.fontSize = `${fontSize}px`;

                box.appendChild(charSpan);
                board.insertBefore(box, canvas);
            }

            pageBadge.textContent = `${currentIndex + 1} / ${currentWords.length}`;
            clearCanvas(false);
            buildLetterGuideMap(word, fontSize);
            speakText(word);
        }

        let lastDrawPos = { x: 0, y: 0 };

        function startDraw(e) {
            isDrawing = true;
            try { canvas.setPointerCapture(e.pointerId); } catch(err){}
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            lastDrawPos = pos;
            playChimeNote();

            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.strokeStyle = currentColor;

            if (e.pressure && e.pressure > 0) {
                ctx.lineWidth = Math.max(baseLineWidth * 0.8, e.pressure * (baseLineWidth * 1.4));
            } else {
                ctx.lineWidth = baseLineWidth;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            checkStrokeCoverage(pos.x, pos.y);
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

            const dist = Math.hypot(pos.x - lastDrawPos.x, pos.y - lastDrawPos.y);
            if (dist > 16) {
                playChimeNote();
                lastDrawPos = pos;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            checkStrokeCoverage(pos.x, pos.y);
        }

        function endDraw(e) {
            if (!isDrawing) return;
            isDrawing = false;
            ctx.closePath();
            try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}

            if (charGuideMaps.length === 0) return;

            /* 🎯 80% 달성 시 해당 글자 완성 판정 */
            charGuideMaps.forEach(charMap => {
                if (!charMap.isDone && charMap.points.length > 0) {
                    const ratio = charMap.hitCount / charMap.points.length;
                    if (ratio >= 0.80) {
                        charMap.isDone = true;
                        
                        const box = document.querySelector(`.char-box[data-char-index="${charMap.charIndex}"]`);
                        if (box) box.classList.add('char-done');

                        soundCharDone();
                        speakText(charMap.char);
                    }
                }
            });

            if (!isPraiseGiven) {
                const isAllDrawn = charGuideMaps.every(charMap => {
                    if (charMap.points.length === 0) return true;
                    return charMap.isDone;
                });

                if (isAllDrawn) {
                    triggerPraiseEffect();
                }
            }
        }

        canvas.addEventListener('pointerdown', startDraw);
        canvas.addEventListener('pointermove', moveDraw);
        canvas.addEventListener('pointerup', endDraw);
        canvas.addEventListener('pointercancel', endDraw);

        function clearCanvas(playSound = true) {
            if (playSound) soundClear();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            resetPraiseEffect();
            
            document.querySelectorAll('.char-box').forEach(box => box.classList.remove('char-done'));

            charGuideMaps.forEach(charMap => {
                charMap.points.forEach(pt => pt.hit = false);
                charMap.hitCount = 0;
                charMap.isDone = false;
            });
        }

        function nextWord() {
            currentIndex = (currentIndex + 1) % currentWords.length;
            renderWord(currentWords[currentIndex]);
        }

        function prevWord() {
            currentIndex = (currentIndex - 1 + currentWords.length) % currentWords.length;
            renderWord(currentWords[currentIndex]);
        }

        function updateLayout() {
            fitCanvas();
            renderWord(currentWords[currentIndex]);
        }

        initCategoryBar();
        window.addEventListener('resize', updateLayout);
        window.addEventListener('orientationchange', () => {
            setTimeout(updateLayout, 150);
        });
        document.fonts.ready.then(updateLayout);
    </script>
</body>
</html>
